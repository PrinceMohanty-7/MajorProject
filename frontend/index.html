<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F6FC" />
    <meta name="description" content="Check suspicious links and messages for common scam warning signs with ScamShield AI." />
    <title>ScamShield AI — Stay one step ahead</title>
    <script>
      (() => {
        let theme = 'system';
        try {
          theme = localStorage.getItem('scamshield-theme') || 'system';
        } catch {
          theme = 'system';
        }
        const isDark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
